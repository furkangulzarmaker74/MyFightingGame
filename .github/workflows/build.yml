name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          docker pull kivy/buildozer:latest
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            kivy/buildozer:latest android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyFightingGame-APK
          path: bin/*.apk
